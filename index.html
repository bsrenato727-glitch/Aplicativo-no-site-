<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PORTARIA REMBRANDT - V5.9</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --primary: #075E54; --accent: #25D366; --bg: #f0f2f5; --red: #ff4d4d; --blue: #007bff; --gray: #6c757d; --orange: #f39c12; }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); touch-action: manipulation; }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; font-size: 1.1rem; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-success { background: var(--accent); color: white; border: none; font-weight: bold; }
        .btn-outline { background: white; color: var(--primary); border: 1px solid var(--primary); margin-top: 10px; }
        .btn-danger { background: var(--red); color: white; border: none; margin-top: 5px; font-size: 14px; padding: 8px; }
        .btn-acrescimo { background: var(--orange); color: white; border: none; padding: 6px 12px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .item-temp { background: #ffffff; padding: 10px; margin-top: 8px; border-radius: 6px; font-size: 0.95rem; border: 1px solid #dae1e9; border-left: 5px solid var(--blue); }
        .acrescimo-item { background: #e8f5e9; padding: 10px; margin-top: 8px; border-radius: 6px; border-left: 5px solid var(--accent); }
        .hidden { display: none !important; }
        .scanner-box { width: 100%; border-radius: 8px; margin-top: 10px; display: none; background: #000; overflow: hidden; }
        .galeria-fotos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .foto-container { position: relative; width: 80px; height: 80px; }
        .foto-mini { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #ccc; }
        .btn-del { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #signature-pad { border: 2px solid #333; background: #fff; width: 100%; height: 200px; border-radius: 8px; touch-action: none; margin-top: 10px; }
        .lista-moradores-scroll { max-height: 250px; overflow-y: auto; margin-top: 15px; border: 1px solid #ddd; padding: 5px; border-radius: 8px; background: #fafafa; }
        .morador-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-historico { background: var(--gray); color: white; font-weight: bold; border: none; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .btn-historico::after { content: '▼'; font-size: 12px; }
        .btn-historico.active::after { content: '▲'; }
        #conteudo-historico { display: none; padding-top: 15px; }
        .hist-item { border-left: 5px solid var(--gray); margin-bottom: 8px; padding: 10px; background: #f8f9fa; border-radius: 6px; font-size: 0.85rem; }
        .filtro-input { margin-bottom: 10px; border: 2px solid #ddd; background: #fff; }
        .painel-status { display: flex; gap: 8px; margin-bottom: 15px; }
        .status-badge { flex: 1; padding: 10px 8px; border-radius: 10px; text-align: center; font-size: 0.75rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .status-ok { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-erro { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-aguardando { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .enc-pendente-card { display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--primary); flex-wrap: wrap; gap: 8px; }
        .enc-pendente-card .botoes { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-inline { width: auto; padding: 8px 14px; border-radius: 5px; font-size: 0.85rem; border: none; cursor: pointer; font-weight: bold; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .loading-box { background: white; padding: 30px 40px; border-radius: 12px; text-align: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="app-content">
    <header>🏢 PORTARIA REMBRANDT</header>

    <div class="container">

        <div class="painel-status" id="painel-status">
            <div class="status-badge status-aguardando" id="badge-supabase"><span class="pulse">⏳</span> Supabase...</div>
            <div class="status-badge status-aguardando" id="badge-storage"><span class="pulse">⏳</span> Fotos no Supabase...</div>
        </div>

        <div id="tela-config-imgbb" class="hidden"></div>

        <div id="tela-registro" class="card">
            <h3>📥 Registrar Encomenda</h3>
            <input type="search" id="busca-morador" placeholder="🔎 Buscar por apartamento ou nome" oninput="window.filtrarMoradores()" autocomplete="off">
            <select id="apt-select" onchange="window.verificarMorador()"><option value="">Carregando moradores...</option></select>
            <div style="background:#f9f9f9;padding:10px;border-radius:8px;margin-top:10px;border:1px solid #eee;">
                <input type="text" id="protocolo-input" placeholder="Protocolo/Código">
                <button class="btn-outline" onclick="window.abrirScanner()">📷 SCANNER</button>
                <div id="reader" class="scanner-box"></div>
                <input type="text" id="desc-input" placeholder="O que chegou?">
                <button class="btn-outline" style="background:var(--blue);color:white;border:none;" onclick="window.incluirNaLista()">➕ ADICIONAR ITEM</button>
            </div>
            <div id="lista-temp"></div>
            <label style="display:block;margin-top:20px;font-weight:bold;">📸 Fotos das Encomendas:</label>
            <input type="file" id="foto-input" accept="image/*" capture="camera" onchange="window.processarFoto(this)">
            <div id="galeria" class="galeria-fotos"></div>
            <button class="btn-success" id="btn-salvar-geral" onclick="window.registrarEntrada()" style="margin-top:25px;display:none;">SALVAR E AVISAR WHATSAPP</button>
            <button class="btn-outline" onclick="window.abrirGestao()" style="margin-top:40px;border-style:dashed;color:#555;">⚙️ GESTÃO DE MORADORES</button>
        </div>

        <div id="tela-cadastro" class="card hidden">
            <h3>👥 Gerenciar Moradores</h3>
            <div style="background:#eef1f5;padding:12px;border-radius:8px;">
                <input type="number" id="cad-apto" placeholder="Apto">
                <input type="text" id="cad-nome" placeholder="Nome">
                <input type="text" id="cad-whats" placeholder="WhatsApp (DDI+DDD+Num)">
                <button class="btn-success" onclick="window.salvarMorador()">CADASTRAR</button>
            </div>
            <input type="search" id="busca-moradores-cadastrados" placeholder="🔎 Buscar morador ou apartamento" oninput="window.filtrarListaMoradores()" autocomplete="off">
            <div id="lista-contatos-excluir" class="lista-moradores-scroll"></div>
            <button class="btn-outline" onclick="window.fecharGestao()">VOLTAR</button>
        </div>

        <div id="tela-entrega" class="card hidden">
            <h3>📤 Retirada de Encomenda</h3>
            <div id="detalhes-entrega-texto" style="margin-bottom:15px;font-size:0.9rem;"></div>
            <input type="text" id="nome-receptor" placeholder="Quem está retirando?">
            <label style="display:block;margin-top:10px;">Assinatura:</label>
            <canvas id="signature-pad"></canvas>
            <button class="btn-danger" onclick="window.limparAssinatura()">🧹 LIMPAR ASSINATURA</button>
            <button class="btn-success" onclick="window.finalizarEntrega()" style="margin-top:25px;">CONCLUIR E GERAR RECIBO</button>
            <button class="btn-outline" onclick="location.reload()">CANCELAR</button>
        </div>

        <div id="tela-acrescimo" class="card hidden">
            <h3>➕ Acrescentar Encomenda</h3>
            <div id="acrescimo-info" style="background:#e8f5e9;padding:10px;border-radius:8px;margin-bottom:10px;font-size:0.9rem;"></div>
            <div style="background:#f9f9f9;padding:10px;border-radius:8px;border:1px solid #eee;">
                <input type="text" id="acrescimo-protocolo" placeholder="Protocolo/Código">
                <button class="btn-outline" onclick="window.abrirScannerAcrescimo()">📷 SCANNER</button>
                <div id="reader-acrescimo" class="scanner-box"></div>
                <input type="text" id="acrescimo-desc" placeholder="O que chegou?">
                <button class="btn-outline" style="background:var(--accent);color:white;border:none;" onclick="window.adicionarItemAcrescimo()">➕ ADICIONAR ITEM</button>
            </div>
            <div id="lista-acrescimo-temp"></div>
            <label style="display:block;margin-top:15px;font-weight:bold;">📸 Foto da Nova Encomenda:</label>
            <input type="file" id="acrescimo-foto" accept="image/*" capture="camera" onchange="window.processarFotoAcrescimo(this)">
            <div id="galeria-acrescimo" class="galeria-fotos"></div>
            <button class="btn-success" onclick="window.confirmarAcrescimo()" style="margin-top:20px;">CONFIRMAR E AVISAR MORADOR</button>
            <button class="btn-outline" onclick="window.cancelarAcrescimo()">VOLTAR</button>
        </div>

        <div id="lista-aguardando">
            <h3>📦 Encomendas na Portaria</h3>
            <div id="itens-lista"></div>
        </div>

        <div class="card" style="padding:0;overflow:hidden;">
            <button class="btn-historico" onclick="window.toggleHistorico()" id="btn-hist-main">✅ HISTÓRICO DE ENTREGAS</button>
            <div id="conteudo-historico" style="padding:15px;">
                <div style="background:#f1f3f5;padding:10px;border-radius:8px;margin-bottom:15px;">
                    <label style="font-size:0.75rem;font-weight:bold;">📅 POR DATA:</label>
                    <input type="date" id="filtro-data" class="filtro-input" onchange="window.filtrarHistorico()">
                    <label style="font-size:0.75rem;font-weight:bold;">🏢 POR APARTAMENTO:</label>
                    <input type="number" id="filtro-apto" class="filtro-input" placeholder="Ex: 101" oninput="window.filtrarHistorico()">
                    <button class="btn-danger" onclick="window.limparFiltrosHistorico()" style="padding:5px;font-size:0.7rem;margin-top:5px;">LIMPAR FILTROS / VER ÚLTIMAS 50</button>
                </div>
                <div id="lista-historico"></div>
            </div>
        </div>
    </div>
</div>

<div id="loading-overlay" class="loading-overlay" style="display:none;">
    <div class="loading-box">
        <div class="spinner"></div>
        <div id="loading-texto">Processando...</div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('https://fpfykmxwtmngxeyyljaz.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZwZnlrbXh3dG1uZ3hleXlsamF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzODU5NjAsImV4cCI6MjA5MDk2MTk2MH0.yaFPUO_2phJwqma5VaHNfLqSqnuWqLZdxchL3YB6KSA');
    
    // Se o usuário configurou uma chave no painel, usa ela. Senão, usa a padrão.

    let moradorAtual = null;
    let entregaAtual = null;
    let listaRascunho = [];
    let listaFotosBlobs = [];
    let listaFotosVisualizacao = [];
    let acrescimoAtual = null;
    let listaAcrescimoRascunho = [];
    let listaFotosAcrescimoBlobs = [];
    let listaFotosAcrescimoVis = [];
    let canvas, ctx, desenhando = false;
    let encomendasPendentes = [];
    function escaparHTML(valor) {
        return String(valor == null ? '' : valor).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function separarItensDescricao(descricao, moradorPadrao) {
        return String(descricao || '').split(' | ').filter(Boolean).map(raw => {
            const marca = raw.match(/^\[\[RID:([^\]]+)\]\]\s*/);
            const moradorId = marca ? marca[1] : '';
            const texto = marca ? raw.slice(marca[0].length) : raw;
            const morador = moradorId ? moradoresCache.find(m => String(m.id) === String(moradorId)) : null;
            return { raw, texto, moradorId, morador: morador ? morador.Morador : (moradorPadrao || '') };
        });
    }
    function codificarItemDescricao(item, morador) {
        const detalhe = item.desc + ' (Prot: ' + item.prot + ')';
        return morador && morador.id != null ? '[[RID:' + morador.id + ']] ' + detalhe : detalhe;
    }
    function localizarMoradorDoItem(item, registro) {
        if(item.moradorId) {
            const porId = moradoresCache.find(m => String(m.id) === String(item.moradorId));
            if(porId) return porId;
        }
        return moradoresCache.find(m => String(m.Apartamento) === String(registro.Apartamento) && String(m.Morador || '').trim() === String(registro.Morador || '').trim()) || null;
    }
    function identificarResponsavel(item, registro) {
        const morador = localizarMoradorDoItem(item, registro);
        const id = morador ? String(morador.id) : String(item.moradorId || '');
        const nome = morador ? String(morador.Morador || '') : String(item.morador || registro.Morador || 'Destinatário não identificado');
        const chave = id ? 'id:' + id : 'legacy:' + String(registro.Apartamento) + ':' + nome.trim().toLowerCase();
        return { morador, id, nome, chave };
    }
    function itemPertenceAoGrupo(item, registro, grupo) {
        return identificarResponsavel(item, registro).chave === grupo.chave;
    }
    function renderizarOpcoesMoradores() {
        const sel = document.getElementById('apt-select');
        if(!sel) return;
        const atual = sel.value;
        const filtro = String(document.getElementById('busca-morador')?.value || '').trim().toLowerCase();
        const filtrados = moradoresCache.filter(m => !filtro || String(m.Apartamento || '').toLowerCase().includes(filtro) || String(m.Morador || '').toLowerCase().includes(filtro));
        sel.innerHTML = '<option value="">Selecione o apartamento e o morador...</option>' + filtrados.map(m => {
            const digitos = String(m.Status || '').replace(/\D/g, '');
            const finalWhats = digitos ? ' • final ' + digitos.slice(-4) : ' • sem WhatsApp';
            return '<option value="' + escaparHTML(m.id) + '">Apto ' + escaparHTML(m.Apartamento) + ' — ' + escaparHTML(m.Morador) + finalWhats + '</option>';
        }).join('');
        if(filtrados.some(m => String(m.id) === String(atual))) sel.value = atual;
        else sel.value = '';
    }
    window.filtrarMoradores = () => {
        renderizarOpcoesMoradores();
        window.verificarMorador();
    };
    function renderizarListaMoradores() {
        const lista = document.getElementById('lista-contatos-excluir');
        if(!lista) return;
        const filtro = String(document.getElementById('busca-moradores-cadastrados')?.value || '').trim().toLowerCase();
        const filtrados = moradoresCache.filter(m => !filtro || String(m.Apartamento || '').toLowerCase().includes(filtro) || String(m.Morador || '').toLowerCase().includes(filtro));
        if(!filtrados.length) {
            lista.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">Nenhum morador encontrado.</p>';
            return;
        }
        lista.innerHTML = filtrados.map(m => '<div class="morador-item"><span><b>' + escaparHTML(m.Apartamento) + '</b> - ' + escaparHTML(m.Morador) + '<br><small style="color:#888;">' + escaparHTML(m.Status || 'Sem WhatsApp') + '</small></span><button onclick="window.excluirMorador(' + Number(m.id) + ')" class="btn-inline" style="background:red;color:white;padding:5px 10px;font-size:0.8rem;">🗑️</button></div>').join('');
    }
    window.filtrarListaMoradores = () => renderizarListaMoradores();
    function carregarScanner() {
        if(window.Html5Qrcode) return Promise.resolve();
        if(!promessaScanner) promessaScanner = new Promise((resolve,reject) => {
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
            script.async = true;
            script.onload = () => window.Html5Qrcode ? resolve() : reject(new Error('A biblioteca do scanner não carregou.'));
            script.onerror = () => reject(new Error('Não consegui carregar o scanner. Verifique a conexão com a internet.'));
            document.head.appendChild(script);
        });
        return promessaScanner;
    }
    async function pararLeitorQR(id) {
        const scanner = id === 'reader' ? scannerPrincipal : scannerAcrescimo;
        const box = document.getElementById(id);
        try {
            if(scanner && scanner.isScanning) await scanner.stop();
            if(scanner) scanner.clear();
        } catch(e) { console.warn('Não foi possível encerrar a câmera:', e); }
        if(id === 'reader') scannerPrincipal = null; else scannerAcrescimo = null;
        if(box) { box.style.display = 'none'; box.innerHTML = ''; }
    }
    window.fecharScanner = id => pararLeitorQR(id);
    async function iniciarLeitorQR(id, inputId) {
        const box = document.getElementById(id);
        if(!box) return alert('Não encontrei a área do scanner.');
        if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return alert('A câmera só funciona em uma página HTTPS aberta no Chrome. Abra o site pelo link HTTPS e tente novamente.');
        }
        box.style.display = 'block';
        box.style.minHeight = '180px';
        box.innerHTML = '<p style="color:white;text-align:center;padding:18px;">Preparando a câmera...</p>';
        try {
            await carregarScanner();
            await new Promise(resolve => setTimeout(resolve, 150));
            box.innerHTML = '';
            let cameras = [];
            try { cameras = await Html5Qrcode.getCameras(); } catch(e) { console.warn('Lista de câmeras indisponível; tentarei a câmera traseira.', e); }
            const traseira = cameras.find(c => /back|rear|environment|traseir/i.test(c.label || '')) || cameras[0];
            const scanner = new Html5Qrcode(id, { verbose: false });
            if(id === 'reader') scannerPrincipal = scanner; else scannerAcrescimo = scanner;
            const config = { fps: 10, qrbox: (largura, altura) => ({ width: Math.max(100, Math.min(250, largura)), height: Math.max(100, Math.min(150, altura)) }) };
            await scanner.start(traseira ? traseira.id : { facingMode: 'environment' }, config, async texto => {
                const input = document.getElementById(inputId);
                if(input) input.value = texto;
                tocarBip();
                await pararLeitorQR(id);
            });
        } catch(e) {
            await pararLeitorQR(id);
            const detalhe = String(e && (e.message || e) || '');
            if(/notallowed|permission|denied/i.test(detalhe)) alert('A câmera foi bloqueada pelo navegador. No Chrome, permita a câmera para este site e tente novamente.');
            else if(/notfound|no camera/i.test(detalhe)) alert('Não encontrei uma câmera disponível neste celular.');
            else alert('Não consegui abrir o scanner. Confira se o Chrome tem permissão para usar a câmera e tente novamente. ' + detalhe);
        }
    }
    window.abrirAvisoEntrega = (indice) => {
        const aviso = avisosEntregaPendentes[indice];
        if(aviso && aviso.url) window.open(aviso.url, '_blank');
    };
    window.voltarEncomendas = () => location.reload();

    let moradoresCache = [];
    let avisosEntregaPendentes = [];
    let gruposEntregaPendentes = [];
    let apartamentosEntregaPendentes = [];
    let scannerPrincipal = null;
    let scannerAcrescimo = null;
    let promessaScanner = null;
    let salvandoEntrada = false;
    let salvandoAcrescimo = false;

    function mostrarLoading(texto) {
        document.getElementById('loading-texto').innerText = texto || 'Processando...';
        document.getElementById('loading-overlay').style.display = 'flex';
    }
    function esconderLoading() {
        document.getElementById('loading-overlay').style.display = 'none';
    }
    function tocarBip() {
        try {
            const ac = new (window.AudioContext || window.webkitAudioContext)();
            const o = ac.createOscillator(); const g = ac.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(750, ac.currentTime);
            g.gain.setValueAtTime(0.5, ac.currentTime);
            o.connect(g); g.connect(ac.destination); o.start();
            setTimeout(() => o.stop(), 120);
        } catch(e) {}
    }

    // Envio de fotos para o bucket público de encomendas no Supabase.
    const BUCKET_FOTOS = 'fotos_encomendas';
    function mostrarEstadoStorage(tipo, texto) {
        const badge = document.getElementById('badge-storage');
        if (!badge) return;
        badge.className = 'status-badge ' + (tipo === 'ok' ? 'status-ok' : tipo === 'erro' ? 'status-erro' : 'status-aguardando');
        badge.textContent = texto;
    }
    async function comprimirFotoParaEncomenda(file) {
        if (!file || !/^image\//i.test(file.type || '')) {
            throw new Error('O arquivo selecionado não parece ser uma imagem.');
        }
        if (file.size > 20 * 1024 * 1024) {
            throw new Error('A foto original passa de 20 MB. Tire uma foto nova ou reduza o tamanho antes de enviar.');
        }
        const objectUrl = URL.createObjectURL(file);
        try {
            const img = new Image();
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = () => reject(new Error('Não consegui abrir a foto para reduzir o tamanho.'));
                img.src = objectUrl;
            });
            const maxDim = 1600;
            const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
            const ctx = canvas.getContext('2d', { alpha: false });
            if (!ctx) throw new Error('Não consegui preparar a foto neste celular.');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const blob = await new Promise((resolve, reject) => canvas.toBlob(
                b => b ? resolve(b) : reject(new Error('Falha ao comprimir a foto.')),
                'image/jpeg', 0.72
            ));
            if (blob.size > 10 * 1024 * 1024) throw new Error('A foto ainda ficou maior que o limite após a compressão.');
            return new File([blob], 'foto-encomenda.jpg', { type: 'image/jpeg', lastModified: Date.now() });
        } finally {
            URL.revokeObjectURL(objectUrl);
        }
    }
    async function enviarFotoSupabase(file) {
        const fotoReduzida = await comprimirFotoParaEncomenda(file);
        const ext = 'jpg';
        const nome = 'enc_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10) + '.' + ext;
        const { data, error } = await supabase.storage.from(BUCKET_FOTOS).upload(nome, fotoReduzida, {
            cacheControl: '3600', upsert: false, contentType: 'image/jpeg'
        });
        if (error) throw new Error(error.message || 'Falha ao enviar a foto ao Supabase.');
        const { data: urlData } = supabase.storage.from(BUCKET_FOTOS).getPublicUrl(data.path);
        if (!urlData || !urlData.publicUrl) throw new Error('A foto foi enviada, mas não consegui obter o link público.');
        return urlData.publicUrl;
    }

    async function subirFotos(arrBlobs) {
        const urls = [];

    function normalizarAssinaturaItem(raw) {
        return String(raw || '').replace(/^\[\[RID:[^\]]+\]\]\s*/, '').trim().replace(/\s+/g, ' ').toLowerCase();

    function encontrarDuplicataItens(novos, registros, morador) {
        const existentes = new Set();
        (registros || []).forEach(registro => {
            separarItensDescricao(registro.Descrição, registro.Morador).forEach(item => {
                if(String(identificarResponsavel(item, registro).id) === String(morador.id)) existentes.add(normalizarAssinaturaItem(item.raw));
            });
        });
        const vistos = new Set();
        for(const item of novos) {
            const assinatura = normalizarAssinaturaItem(codificarItemDescricao(item, morador));
            if(existentes.has(assinatura) || vistos.has(assinatura)) return item;
            vistos.add(assinatura);
        }
        return null;
    }

    window.registrarEntrada = async () => {
        const btn = document.getElementById('btn-salvar-geral');
        if(salvandoEntrada) return;
        if(!moradorAtual || !moradorAtual.Apartamento) return alert('Selecione o morador destinatário!');
        if(listaRascunho.length === 0) return alert('Adicione pelo menos um item!');
        salvandoEntrada = true;
        const destinatario = moradorAtual;
        const itensParaSalvar = listaRascunho.map(i => ({...i}));
        const fotosParaSalvar = [...listaFotosBlobs];
        const apto = String(destinatario.Apartamento);
        btn.innerText = '⏳ ENVIANDO...'; btn.disabled = true;
        mostrarLoading('Enviando fotos e salvando...');
        try {
            const { data: existentes, error: erroBusca } = await supabase.from('Encomendas').select('*').eq('Apartamento', apto).eq('Status', 'pendente').order('created_at', { ascending: true });
            if(erroBusca) throw erroBusca;
            const duplicado = encontrarDuplicataItens(itensParaSalvar, existentes, destinatario);
            if(duplicado && !confirm('Já existe uma encomenda igual para este morador, com a mesma descrição e protocolo. Deseja registrar novamente mesmo assim?')) return;
            const linksDasFotos = await subirFotos(fotosParaSalvar);
            const descricaoNova = itensParaSalvar.map(i => codificarItemDescricao(i, destinatario)).join(' | ');
            let alvo = null;
            (existentes || []).some(registro => {
                const pertence = separarItensDescricao(registro.Descrição, registro.Morador).some(item => String(identificarResponsavel(item, registro).id) === String(destinatario.id));
                if(pertence) { alvo = registro; return true; }
                return false;
            });
            let erroSalvar = null;
            if(alvo) {
                const descricaoFinal = alvo.Descrição ? alvo.Descrição + ' | ' + descricaoNova : descricaoNova;
                let fotosFinal = alvo.Fotos || '';
                if(linksDasFotos) fotosFinal = fotosFinal ? fotosFinal + ' , ' + linksDasFotos : linksDasFotos;
                const resp = await supabase.from('Encomendas').update({ Descrição: descricaoFinal, Fotos: fotosFinal }).eq('id', alvo.id).eq('Status', 'pendente');
                erroSalvar = resp.error;
            } else {
                const resp = await supabase.from('Encomendas').insert([{ Apartamento: apto, Morador: destinatario.Morador || '', Descrição: descricaoNova, Status: 'pendente', Fotos: linksDasFotos }]);
                erroSalvar = resp.error;
            }
            if(erroSalvar) throw erroSalvar;

            let volumesMsg = '';
            itensParaSalvar.forEach((item, idx) => { volumesMsg += '*Volume ' + (idx + 1) + ':*%0A' + item.desc + '%0AProtocolo: ' + item.prot + '%0A%0A'; });
            let linkFotoMsg = '';
            if(linksDasFotos) {

                linksDasFotos.split(' , ').forEach(f => { if(f.trim()) linksFormatados += f.trim() + '%0A'; });
                linkFotoMsg = '%0A📸 *Foto(s):*%0A' + linksFormatados;
            }
            const tel = String(destinatario.Status || '').replace(/\D/g, '');
            const msg = '🏢 *PORTARIA REMBRANDT*%0A%0A📍 *Encomenda Chegou!*%0AApartamento: *' + apto + '*%0APara: *' + (destinatario.Morador || '') + '*%0A%0A' + volumesMsg + '_Disponível na portaria._' + linkFotoMsg;
            limparRascunhoPrincipal();
            await carregarTudo();
            if(tel) window.location.href = 'https://api.whatsapp.com/send?phone=' + tel + '&text=' + msg;
            else alert('Encomenda salva para ' + (destinatario.Morador || 'o morador') + ', mas esse cadastro não tem WhatsApp.');
        } catch(e) {
            alert('Erro ao salvar: ' + (e.message || e));
            if(btn) { btn.disabled = false; btn.innerText = 'SALVAR E AVISAR WHATSAPP'; }
        } finally {
            salvandoEntrada = false;
            if(btn && btn.disabled && btn.innerText === '⏳ ENVIANDO...') { btn.disabled = false; btn.innerText = 'SALVAR E AVISAR WHATSAPP'; }
            esconderLoading();

        document.getElementById('lista-aguardando').classList.add('hidden');
        document.getElementById('tela-acrescimo').classList.remove('hidden');
        document.getElementById('acrescimo-info').innerHTML = '<b>Apto ' + escaparHTML(item.Apartamento) + '</b><br><small style="color:#555;">Itens deste registro:<br>' + escaparHTML(String(item.Descrição || '').split(' | ').map(x => separarItensDescricao(x, item.Morador)[0]?.texto || x).join('<br>')) + '</small><label style="display:block;margin-top:10px;font-weight:bold;">Destinatário desta encomenda:</label><select id="acrescimo-residente" style="width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:8px;">' + opcoes + '</select>';
        document.getElementById('lista-acrescimo-temp').innerHTML = '';
        document.getElementById('galeria-acrescimo').innerHTML = '';
        document.getElementById('acrescimo-protocolo').value = '';
        document.getElementById('acrescimo-desc').value = '';
    };

    window.cancelarAcrescimo = () => location.reload();

    window.abrirScannerAcrescimo = () => iniciarLeitorQR('reader-acrescimo', 'acrescimo-protocolo');

    window.adicionarItemAcrescimo = () => {
        const desc = document.getElementById('acrescimo-desc').value.trim();
        if(!desc) return;
        const prot = document.getElementById('acrescimo-protocolo').value.trim() || 'S/ Protocolo';
        const residenteId = document.getElementById('acrescimo-residente')?.value;
        const destinatario = moradoresCache.find(m => String(m.id) === String(residenteId));
        const assinatura = normalizarAssinaturaItem(codificarItemDescricao({ desc, prot }, destinatario));
        if(listaAcrescimoRascunho.some(i => normalizarAssinaturaItem(codificarItemDescricao(i, destinatario)) === assinatura)) {
            return alert('Esse mesmo item já está na lista desta encomenda.');
        }
        listaAcrescimoRascunho.push({ desc, prot });
        document.getElementById('lista-acrescimo-temp').innerHTML = listaAcrescimoRascunho.map(i => '<div class="acrescimo-item">📦 ' + escaparHTML(i.desc) + '<br><small>Prot: ' + escaparHTML(i.prot) + '</small></div>').join('');
        document.getElementById('acrescimo-protocolo').value = '';
        document.getElementById('acrescimo-desc').value = '';
    };

    window.processarFotoAcrescimo = (input) => {
        if(input.files && input.files[0]) {
            const file = input.files[0]; listaFotosAcrescimoBlobs.push(file);
            const reader = new FileReader();
            reader.onload = (e) => {
                listaFotosAcrescimoVis.push(e.target.result);
                document.getElementById('galeria-acrescimo').innerHTML = listaFotosAcrescimoVis.map((f, i) => '<div class="foto-container"><img src="' + f + '" class="foto-mini"><button class="btn-del" onclick="window.removerFotoAcrescimo(' + i + ')">X</button></div>').join('');
            };
            reader.readAsDataURL(file);
        }
    };

    window.removerFotoAcrescimo = (idx) => {
        listaFotosAcrescimoBlobs.splice(idx, 1); listaFotosAcrescimoVis.splice(idx, 1);
        document.getElementById('galeria-acrescimo').innerHTML = listaFotosAcrescimoVis.map((f, i) => '<div class="foto-container"><img src="' + f + '" class="foto-mini"><button class="btn-del" onclick="window.removerFotoAcrescimo(' + i + ')">X</button></div>').join('');
    };

    window.confirmarAcrescimo = async () => {
        if(salvandoAcrescimo) return;
        if(listaAcrescimoRascunho.length === 0) return alert('Adicione pelo menos um item!');
        const residenteId = document.getElementById('acrescimo-residente')?.value;
        const destinatario = moradoresCache.find(m => String(m.id) === String(residenteId));
        if(!destinatario) return alert('Selecione o morador destinatário desta encomenda.');
        salvandoAcrescimo = true;
        const itensParaSalvar = listaAcrescimoRascunho.map(i => ({...i}));
        const fotosParaSalvar = [...listaFotosAcrescimoBlobs];
        moradorAtual = destinatario;
        mostrarLoading('Enviando fotos e atualizando...');
        try {
            const { data: existentes, error: erroBusca } = await supabase.from('Encomendas').select('*').eq('Apartamento', String(destinatario.Apartamento)).eq('Status', 'pendente').order('created_at', { ascending: true });
            if(erroBusca) throw erroBusca;
            const duplicado = encontrarDuplicataItens(itensParaSalvar, existentes, destinatario);
            if(duplicado && !confirm('Já existe uma encomenda igual para este morador, com a mesma descrição e protocolo. Deseja registrar novamente mesmo assim?')) return;
            const novasUrls = fotosParaSalvar.length ? await subirFotos(fotosParaSalvar) : '';
            const novaDesc = itensParaSalvar.map(i => codificarItemDescricao(i, destinatario)).join(' | ');
            let alvo = null;
            (existentes || []).some(registro => {
                const pertence = separarItensDescricao(registro.Descrição, registro.Morador).some(item => String(identificarResponsavel(item, registro).id) === String(destinatario.id));
                if(pertence) { alvo = registro; return true; }
                return false;
            });
            let erroSalvar = null;
            if(alvo) {
                const descAtualizada = alvo.Descrição ? alvo.Descrição + ' | ' + novaDesc : novaDesc;
                let fotosAtualizadas = alvo.Fotos || '';
                if(novasUrls) fotosAtualizadas = fotosAtualizadas ? fotosAtualizadas + ' , ' + novasUrls : novasUrls;
                const resp = await supabase.from('Encomendas').update({ Descrição: descAtualizada, Fotos: fotosAtualizadas }).eq('id', alvo.id).eq('Status', 'pendente');
                erroSalvar = resp.error;
            } else {
                const resp = await supabase.from('Encomendas').insert([{ Apartamento: String(destinatario.Apartamento), Morador: destinatario.Morador || '', Descrição: novaDesc, Status: 'pendente', Fotos: novasUrls }]);
                erroSalvar = resp.error;
            }
            if(erroSalvar) throw erroSalvar;
            let volumesMsg = '';
            itensParaSalvar.forEach((item, idx) => { volumesMsg += '*Volume ' + (idx + 1) + ':*%0A' + item.desc + '%0AProtocolo: ' + item.prot + '%0A%0A'; });
            let linkFotoMsg = '';
            if(novasUrls) {
                let linksFormatados = '';
                novasUrls.split(' , ').forEach(f => { if(f.trim()) linksFormatados += f.trim() + '%0A'; });
                linkFotoMsg = '%0A📸 *Foto(s) da nova encomenda:*%0A' + linksFormatados;
            }
            const tel = String(destinatario.Status || '').replace(/\D/g, '');
            const msg = '🏢 *PORTARIA REMBRANDT*%0A%0A📍 *Nova Encomenda Adicionada!*%0AApartamento: *' + destinatario.Apartamento + '*%0APara: *' + (destinatario.Morador || '') + '*%0A%0A' + volumesMsg + '_Mais esta encomenda disponível na portaria._' + linkFotoMsg;
            limparRascunhoAcrescimo();
            await carregarTudo();
            if(tel) window.location.href = 'https://api.whatsapp.com/send?phone=' + tel + '&text=' + msg;
            else alert('Encomenda adicionada para ' + (destinatario.Morador || 'o morador') + '! O cadastro não tem WhatsApp.');
        } catch(e) { alert('Erro ao atualizar: ' + (e.message || e)); }
        finally { salvandoAcrescimo = false; esconderLoading(); }
    };

    window.abrirEntrega = async (item) => {
        const primeira = separarItensDescricao(item.Descrição, item.Morador)[0];
        if(!primeira) return alert('Não encontrei itens pendentes nesse registro.');
        const dono = identificarResponsavel(primeira, item);
        const grupo = { chave: dono.chave, id: dono.id, morador: dono.morador, nome: dono.nome, apartamento: item.Apartamento };
        const idx = gruposEntregaPendentes.findIndex(g => g.chave === grupo.chave && String(g.apartamento) === String(grupo.apartamento));
        if(idx >= 0) return window.abrirEntregaPorGrupo(idx);
        gruposEntregaPendentes.push(grupo);
        return window.abrirEntregaPorGrupo(gruposEntregaPendentes.length - 1);
    };

    window.finalizarEntrega = async () => {
        const receptor = document.getElementById('nome-receptor').value.trim();
        if(!receptor) return alert('Quem está retirando?');
        if(!entregaAtual || !entregaAtual.registros || !entregaAtual.registros.length) return alert('Não há encomendas para entregar.');
        mostrarLoading('Gerando recibo...');
        try {
            const modoTudo = entregaAtual.modo === 'tudo';
            const grupo = entregaAtual.grupo || null;
            const apto = entregaAtual.apartamento;
            const dataHora = new Date().toLocaleString('pt-BR');
            const itens = entregaAtual.registros.flatMap(lote => lote.selecionados.map(item => ({ item, registro: lote.registro, dono: identificarResponsavel(item, lote.registro) })));
            if(!itens.length) throw new Error('Não há itens selecionados para a retirada.');
            const { jsPDF } = window.jspdf; const doc = new jsPDF();
            doc.setFontSize(16); doc.text('RECIBO - PORTARIA REMBRANDT', 20, 20);
            doc.setFontSize(11);
            doc.text('Apartamento: ' + apto, 20, 35);
            doc.text(modoTudo ? 'Retirada: todas as encomendas pendentes' : 'Morador destinatário: ' + grupo.nome, 20, 42);
            doc.text('Retirado por: ' + receptor, 20, 49);
            doc.text('Data/Hora: ' + dataHora, 20, 56);
            let y = 69; doc.text('Encomendas retiradas:', 20, y);
            for(const linhaItem of itens) {
                const linhaTexto = (modoTudo && linhaItem.dono.nome ? linhaItem.dono.nome + ': ' : '') + linhaItem.item.texto;
                const linhas = doc.splitTextToSize('- ' + linhaTexto, 170);
                for(const linha of linhas) { y += 6; if(y > 255) { doc.addPage(); y = 20; } doc.text(linha, 25, y); }
            }
            if(y > 245) { doc.addPage(); y = 20; }
            doc.addImage(canvas.toDataURL(), 'PNG', 20, y + 10, 70, 25);
            doc.save('Recibo_Apto_' + apto + '_' + new Date().getTime() + '.pdf');

            if(modoTudo) {
                const ids = entregaAtual.registros.map(lote => lote.registro.id);
                const { error } = await supabase.from('Encomendas').update({ Status: 'entregue' }).in('id', ids).eq('Status', 'pendente');
                if(error) throw error;
            } else {
                for(const lote of entregaAtual.registros) {
                    const row = lote.registro;
                    const remainingRaw = lote.restantes.map(i => i.raw);
                    if(!remainingRaw.length) {
                        const { error } = await supabase.from('Encomendas').update({ Status: 'entregue' }).eq('id', row.id).eq('Status', 'pendente');
                        if(error) throw error;
                    } else {
                        const { data: novaEntregue, error: erroInsert } = await supabase.from('Encomendas').insert([{ Apartamento: String(row.Apartamento), Morador: grupo.nome, Descrição: lote.selecionados.map(i => i.raw).join(' | '), Status: 'entregue', Fotos: '', created_at: row.created_at }]).select('id').single();
                        if(erroInsert) throw erroInsert;
                        const { error: erroUpdate } = await supabase.from('Encomendas').update({ Descrição: remainingRaw.join(' | ') }).eq('id', row.id).eq('Status', 'pendente');
                        if(erroUpdate) {
                            if(novaEntregue?.id) await supabase.from('Encomendas').delete().eq('id', novaEntregue.id);
                            throw erroUpdate;
                        }
                    }
                }
            }

            const porMorador = new Map();
            itens.forEach(linhaItem => {
                let morador = linhaItem.dono.morador;
                if(!morador && !modoTudo && grupo) morador = grupo.morador;
                if(!morador) return;
                const chave = String(morador.id || morador.Status || linhaItem.dono.nome);
                if(!porMorador.has(chave)) porMorador.set(chave, { morador, nome: morador.Morador || linhaItem.dono.nome || 'Morador', itens: [] });
                porMorador.get(chave).itens.push(linhaItem.item.texto);
            });
            avisosEntregaPendentes = Array.from(porMorador.values()).filter(g => g.morador.Status).map(g => {
                const tel = String(g.morador.Status).replace(/\D/g, '');
                const lista = g.itens.map(x => '• ' + x).join('%0A');
                const msg = '🏢 *PORTARIA REMBRANDT*%0A%0A✅ *Retirada Confirmada!*%0AApartamento: *' + apto + '*%0APara: *' + g.nome + '*%0AQuem retirou: *' + receptor + '*%0AData: ' + dataHora.split(' ')[0] + '%0AHorário: ' + (dataHora.split(' ')[1] || '') + '%0A%0A*Encomendas retiradas:*%0A' + lista;
                return { nome: g.nome, url: 'https://api.whatsapp.com/send?phone=' + tel + '&text=' + msg };
            });
            const semWhats = Array.from(porMorador.values()).filter(g => !g.morador.Status).map(g => g.nome);
            esconderLoading();
            const descricaoFinal = modoTudo ? 'Foram entregues todas as encomendas pendentes de todos os moradores do Apto ' + escaparHTML(apto) + '.' : 'Foram entregues somente as encomendas de ' + escaparHTML(grupo.nome) + ' — Apto ' + escaparHTML(apto) + '.';
            const tela = document.getElementById('tela-entrega');
            tela.innerHTML = '<h3>✅ Entrega registrada</h3><p style="margin:12px 0;">' + descricaoFinal + '</p>' +
                (avisosEntregaPendentes.length ? '<p>Envie a confirmação para cada morador:</p>' + avisosEntregaPendentes.map((a,i) => '<button class="btn-success" style="margin:6px 0;" onclick="window.abrirAvisoEntrega(' + i + ')">📲 WhatsApp de ' + escaparHTML(a.nome) + '</button>').join('') : '<p>Não encontrei WhatsApps associados às encomendas entregues.</p>') +
                (semWhats.length ? '<p><small>Sem WhatsApp cadastrado: ' + escaparHTML(semWhats.join(', ')) + '</small></p>' : '') +
                '<button class="btn-outline" onclick="window.voltarEncomendas()">VOLTAR À PORTARIA</button>';
        } catch(e) {
            alert('Erro ao finalizar entrega: ' + (e.message || e));
            esconderLoading();
        }
    };

    window.limparAssinatura = () => { if(ctx) ctx.clearRect(0, 0, canvas.width, canvas.height); };

    function iniciarAssinatura() {
        canvas = document.getElementById('signature-pad'); ctx = canvas.getContext('2d');
        canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; ctx.lineWidth = 3;
        const getPos = (e) => { const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; };
        canvas.addEventListener('touchstart', (e) => { ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); desenhando = true; e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { if(desenhando) { const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); } e.preventDefault(); }, { passive: false });
        canvas.addEventListener('touchend', () => desenhando = false);
    }

    window.salvarMorador = async () => {
        const a = document.getElementById('cad-apto').value.trim();
        const n = document.getElementById('cad-nome').value.trim();
        const w = document.getElementById('cad-whats').value.trim();
        if(!a || !n) return alert('Preencha apto e nome!');
        mostrarLoading('Cadastrando...');
        try {
            const { error } = await supabase.from('Moradores').insert([{ Apartamento: a, Morador: n, Status: w, created_at: new Date().toISOString() }]);
            if(error) throw error;
            location.reload();
        } catch(e) {
            alert('Erro ao cadastrar morador: ' + (e.message || e));
            esconderLoading();
        }
    };

    window.excluirMorador = async (id) => { if(confirm('Apagar este morador?')) { await supabase.from('Moradores').delete().eq('id', id); carregarTudo(); } };
    window.abrirGestao = () => { document.getElementById('tela-registro').classList.add('hidden'); document.getElementById('lista-aguardando').classList.add('hidden'); document.getElementById('tela-cadastro').classList.remove('hidden'); };
    window.fecharGestao = () => location.reload();
    window.verificarMorador = async () => {
        const id = document.getElementById('apt-select').value;
        if(!id) { moradorAtual = null; return; }
        moradorAtual = moradoresCache.find(m => String(m.id) === String(id)) || null;
        if(!moradorAtual) {
            const { data, error } = await supabase.from('Moradores').select('*').eq('id', id).maybeSingle();
            if(error) { alert('Não foi possível localizar esse morador.'); return; }
            moradorAtual = data || null;
        }
    };

    window.onload = async () => {
        await testarConexoes();
        await carregarTudo();
    };
</script>
</body>
</html>
